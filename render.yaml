# NexaMind on Render: API (Docker) + Static frontend + Postgres
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nexamind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nexamind-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Frontend Static Site origin (https://nexamind-web.onrender.com). Override in Dashboard if needed.
      - key: CORS_ORIGINS
        fromService:
          name: nexamind-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Set when running more than one instance so real-time events and presence are shared.
      - key: REDIS_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
    # Uploaded files live on local disk. On a paid plan, attach a persistent disk so they
    # survive deploys:
    # disk:
    #   name: nexamind-uploads
    #   mountPath: /data
    #   sizeGB: 5

  - type: web
    name: nexamind-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the Vite build at deploy time
      - key: VITE_API_URL
        fromService:
          name: nexamind-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # Free Postgres: 1 GB, expires after 30 days (fine for demos / student projects).
  - name: nexamind-db
    plan: free
    databaseName: nexamind
    user: nexamind
