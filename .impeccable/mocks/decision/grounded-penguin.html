<!doctype html>
<html><head><meta charset="utf-8"><title>Paperback Shelf</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#FAF8F4;color:#1B1B1B;font:14px/1.45 Figtree,sans-serif;display:grid;grid-template-columns:76px 1fr;grid-template-rows:60px 1fr}
.top{grid-column:1/3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;border-bottom:1px solid #E8E4DC}
.logo{font-weight:800;font-size:19px}
.sw{display:grid;grid-template-columns:1fr 1fr;border-radius:999px;background:#EFEBE3;padding:3px;width:220px}
.sw span{text-align:center;padding:7px 0;border-radius:999px;font-weight:700;font-size:13px}.sw .on{background:#2C5DA8;color:#fff}
.tools{justify-self:end;display:flex;gap:8px}.tools i{width:34px;height:34px;border-radius:50%;background:#EFEBE3;display:block}
.rail{background:#1B1B1B;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
.rail i{width:48px;height:42px;border-radius:10px;display:block;border-left:4px solid transparent}
.rail i:nth-child(1){background:#2E2E2E;border-color:#2C5DA8}
.band{margin:28px 40px 0;height:150px;display:grid;grid-template-rows:1fr 1.3fr 1fr;border-radius:4px;overflow:hidden}
.band div:nth-child(1),.band div:nth-child(3){background:#2C5DA8}
.band div:nth-child(2){background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:40px;letter-spacing:-.02em}
main{padding:24px 40px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-content:start}
.p{background:#fff;border-radius:6px;padding:18px;position:relative;overflow:hidden}
.p::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--s)}
.p h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:4px 0 12px;display:flex;justify-content:space-between}
.r{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #F0ECE4}.r small{color:#6A665E}
</style></head><body>
<header class="top"><div class="logo">NexaMind</div><div class="sw"><span class="on">Solo</span><span>Group</span></div><div class="tools"><i></i><i></i><i></i></div></header>
<nav class="rail"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></nav>
<div style="grid-column:2">
<div class="band"><div></div><div>Good morning, Priya</div><div></div></div>
<main>
<section class="p" style="--s:#E0A526"><h2>Tasks</h2><div class="r">Write release notes<small>Thu</small></div><div class="r">Review PR #42<small>Today</small></div></section>
<section class="p" style="--s:#2E7D5B"><h2>Meetings</h2><div class="r">Standup<small>09:30</small></div><div class="r">Design review<small>14:00</small></div></section>
<section class="p" style="--s:#B8336A"><h2>Chat</h2><div class="r">Sam Lee<small>09:12</small></div><div class="r">#general<small>Mon</small></div></section>
<section class="p" style="--s:#2C5DA8"><h2>Docs</h2><div class="r">Launch plan<small>2 h ago</small></div><div class="r">API design notes<small>Yesterday</small></div></section>
<section class="p" style="--s:#1B1B1B"><h2>Repos</h2><div class="r">api-server<small>PR #42</small></div><div class="r">web-client<small>3 open</small></div></section>
<section class="p" style="--s:#7A6F5C"><h2>Calendar</h2><div class="r">Beta deadline<small>Fri</small></div><div class="r">Retro<small>Mon</small></div></section>
</main></div></body></html>
