<!doctype html>
<html><head><meta charset="utf-8"><title>Workshop Pegboard</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#ECEAE4;color:#20211F;font:14px/1.45 'Schibsted Grotesk',sans-serif;display:grid;grid-template-columns:72px 1fr;grid-template-rows:58px 1fr}
.top{grid-column:1/3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;background:#fff;border-bottom:1px solid #DCD9D2}
.logo{font-weight:800;font-size:19px}
.sw{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid #20211F;border-radius:10px;overflow:hidden;width:210px}
.sw span{text-align:center;padding:6px 0;font-weight:700;font-size:13px}.sw .on{background:#20211F;color:#fff}
.tools{justify-self:end;display:flex;gap:8px}.tools i{width:32px;height:32px;border-radius:8px;background:#ECEAE4;display:block}
.rail{background:#20211F;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0}
.rail i{width:44px;height:40px;border-radius:9px;display:block}.rail i:first-child{background:#F25C2A}
main{padding:30px 38px;background-image:radial-gradient(#C9C6BE 1.4px,transparent 1.4px);background-size:24px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-content:start}
.hd{grid-column:1/4;display:flex;justify-content:space-between;align-items:center}
h1{font-weight:800;font-size:40px;letter-spacing:-.025em}
.btn{background:#F25C2A;color:#fff;font-weight:700;padding:10px 18px;border-radius:10px}
.p{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 0 #D6D3CB}
.p h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#6E6C66;margin-bottom:12px}
.r{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #F0EEE9}.r small{color:#6E6C66}
.empty{border:2px dashed #A9A69E;border-radius:12px;display:grid;place-items:center;color:#6E6C66;font-weight:600;min-height:150px;background:rgba(255,255,255,.4)}
</style></head><body>
<header class="top"><div class="logo">NexaMind</div><div class="sw"><span class="on">Solo</span><span>Group</span></div><div class="tools"><i></i><i></i><i></i></div></header>
<nav class="rail"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></nav>
<main>
<div class="hd"><h1>Morning, Priya. Everything's on the wall.</h1><span class="btn">New page</span></div>
<section class="p"><h2>Tasks</h2><div class="r">Write release notes<small>Thu</small></div><div class="r">Review PR #42<small>Today</small></div></section>
<section class="p"><h2>Today</h2><div class="r">Standup<small>09:30</small></div><div class="r">Design review<small>14:00</small></div></section>
<section class="p"><h2>Chat</h2><div class="r">Sam Lee<small>09:12</small></div><div class="r">#general<small>Mon</small></div></section>
<section class="p" style="grid-column:span 2"><h2>Recent pages</h2><div class="r">Launch plan<small>2 h ago</small></div><div class="r">API design notes<small>Yesterday</small></div></section>
<div class="empty">Repos: connect your first repository</div>
</main></body></html>
