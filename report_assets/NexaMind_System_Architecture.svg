<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
<title id="title">Figure 3.1: NexaMind System Architecture</title><desc id="desc">NexaMind web and mobile clients connect to the FastAPI backend. The service layer connects to PostgreSQL, file storage, AI providers, WebSocket services, and configured email and WebRTC services.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#53687a"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#2878b8"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b3a}.title{font-size:38px;font-weight:700}.sub{font-size:18px;fill:#526579}.sec{font-size:17px;font-weight:700;letter-spacing:1px;fill:#41586c}.head{font-size:20px;font-weight:700}.body{font-size:16px;fill:#344b5d}.small{font-size:14px;fill:#526579}.tiny{font-size:13px;fill:#526579}.box{stroke-width:2}.flow{fill:none;stroke:#53687a;stroke-width:3;marker-end:url(#a)}.api{fill:none;stroke:#2878b8;stroke-width:3;marker-end:url(#b)}.optional{fill:none;stroke:#78899a;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#a)}</style></defs>
<rect width="1800" height="1300" fill="#f5f8fb"/>
<text x="70" y="70" class="title">Figure 3.1: NexaMind System Architecture</text><text x="70" y="106" class="sub">Application layers and connected services, traced from NexaMind 2.0 source and deployment settings</text>
<text x="70" y="162" class="sec">CLIENT APPLICATIONS</text>
<rect x="70" y="184" width="485" height="134" rx="16" fill="#eaf4fc" stroke="#7ab2dc" class="box"/><text x="102" y="225" class="head">Web client</text><text x="102" y="258" class="body">React 19 · Vite · Tailwind CSS</text><text x="102" y="287" class="small">Browser UI, workspace state and authenticated API calls</text>
<rect x="610" y="184" width="485" height="134" rx="16" fill="#eef3ff" stroke="#91a8df" class="box"/><text x="642" y="225" class="head">Mobile client</text><text x="642" y="258" class="body">React Native · Expo</text><text x="642" y="287" class="small">Mobile workspace views and bearer-token API calls</text>
<rect x="1150" y="184" width="580" height="134" rx="16" fill="#fff5e8" stroke="#e2b36c" class="box"/><text x="1182" y="225" class="head">Meetings in the clients</text><text x="1182" y="258" class="body">WebRTC carries live audio and video peer-to-peer</text><text x="1182" y="287" class="small">Backend provides signalling and ICE server configuration</text>
<path d="M312 318V362" class="api"/><path d="M852 318V362" class="api"/><text x="330" y="350" class="small">HTTPS · REST</text><text x="870" y="350" class="small">HTTPS · REST</text>

<rect x="55" y="380" width="1080" height="480" rx="24" fill="#fff" stroke="#91a7b8" stroke-width="2.5"/><text x="86" y="421" class="sec">RENDER · DOCKER API SERVICE</text>
<rect x="88" y="444" width="1014" height="92" rx="14" fill="#edf4fa" stroke="#83a9c6" class="box"/><text x="118" y="481" class="head">FastAPI application</text><text x="118" y="511" class="body">CORS · security headers · bearer-token authentication · request validation · error handling · /health</text>
<path d="M595 536V563" class="flow"/>
<rect x="88" y="570" width="1014" height="103" rx="14" fill="#eef7f3" stroke="#85b7a2" class="box"/><text x="118" y="609" class="head">API routers</text><text x="118" y="640" class="body">Auth · workspaces · documents · tasks · channels · files · meetings/sessions · calendar · finance</text><text x="118" y="663" class="small">AI Copilot · reports · repositories · notifications · video signalling</text>
<path d="M595 673V701" class="flow"/>
<rect x="88" y="708" width="1014" height="123" rx="14" fill="#f4effa" stroke="#ae96c8" class="box"/><text x="118" y="748" class="head">Service layer</text><text x="118" y="779" class="body">Workspace rules and permissions · AI agent planning, orchestration and tools · document and file operations</text><text x="118" y="808" class="small">Meetings and transcription · notifications · calendar · finance · repositories · background jobs</text>

<text x="1210" y="382" class="sec">CONNECTED SERVICES</text><rect x="1200" y="404" width="530" height="455" rx="22" fill="#fff" stroke="#aab8c3" stroke-width="2.2"/>
<rect x="1230" y="432" width="470" height="99" rx="13" fill="#f1edff" stroke="#a796d5" class="box"/><text x="1254" y="470" class="head">AI providers</text><text x="1254" y="500" class="body">Gemini · Groq · embeddings · transcription</text><text x="1254" y="521" class="tiny">Used when a provider key is configured</text>
<rect x="1230" y="548" width="470" height="84" rx="13" fill="#fff2ec" stroke="#d6a187" class="box"/><text x="1254" y="584" class="head">Email and sign-in</text><text x="1254" y="612" class="body">SMTP and Google OAuth, when configured</text>
<rect x="1230" y="649" width="470" height="84" rx="13" fill="#eaf6fb" stroke="#80b5c7" class="box"/><text x="1254" y="685" class="head">Redis (optional)</text><text x="1254" y="713" class="body">Shared WebSocket presence and pub/sub</text>
<rect x="1230" y="750" width="470" height="84" rx="13" fill="#fff5e8" stroke="#e2b36c" class="box"/><text x="1254" y="786" class="head">WebRTC ICE services</text><text x="1254" y="814" class="body">STUN / TURN configuration for meetings</text>
<path d="M1102 746H1160V481H1225" class="optional"/>
<path d="M1102 798H1180V690H1225" class="optional"/>
<path d="M1440 318V360H1747V792H1705" class="optional"/>

<text x="70" y="923" class="sec">DATA PERSISTENCE</text>
<rect x="70" y="950" width="340" height="174" rx="16" fill="#edf7ef" stroke="#83b393" class="box"/><text x="98" y="992" class="head">Relational database</text><text x="98" y="1027" class="body">PostgreSQL on Render</text><text x="98" y="1057" class="small">SQLite for local development</text><text x="98" y="1088" class="small">Workspace and feature records</text>
<rect x="440" y="950" width="340" height="174" rx="16" fill="#fff7e9" stroke="#d8b46d" class="box"/><text x="468" y="992" class="head">File storage</text><text x="468" y="1027" class="body">Configured local disk by default</text><text x="468" y="1057" class="small">Optional S3-compatible storage</text><text x="468" y="1088" class="small">Uploads and repository backups</text>
<rect x="810" y="950" width="325" height="174" rx="16" fill="#f2f5f7" stroke="#aab8c3" class="box"/><text x="838" y="992" class="head">Database access</text><text x="838" y="1027" class="body">SQLAlchemy async models</text><text x="838" y="1057" class="small">Commit on success; rollback on errors</text>
<path d="M380 831V944" class="flow"/><path d="M610 831V944" class="flow"/><path d="M980 831V944" class="flow"/>
<text x="1210" y="923" class="sec">DEPLOYMENT</text><rect x="1200" y="950" width="530" height="174" rx="16" fill="#e9eef3" stroke="#aab8c3" class="box"/><text x="1230" y="992" class="head">Render services</text><text x="1230" y="1027" class="body">Static site serves the built web client</text><text x="1230" y="1057" class="body">Docker service runs the FastAPI backend</text><text x="1230" y="1088" class="small">Managed PostgreSQL stores application records</text>
<rect x="70" y="1160" width="1660" height="74" rx="14" fill="#f0f4f7"/><text x="96" y="1193" class="small">Dashed arrows mark optional or externally configured connections. Meeting media flows between clients; the backend coordinates signalling and connection setup.</text><text x="96" y="1218" class="tiny">Available integrations depend on environment settings.</text>
</svg>
