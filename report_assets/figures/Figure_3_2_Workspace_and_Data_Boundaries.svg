<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#586b7d"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1b3040}.h{font-size:32px;font-weight:700}.s{font-size:17px;fill:#526579}.b{font-size:19px;font-weight:700}.t{font-size:16px;fill:#405567}.sm{font-size:14px;fill:#586b7d}.line{fill:none;stroke:#586b7d;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#7c8b98;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#a)}</style></defs><rect width="1500" height="930" fill="#f5f8fb"/><text x="60" y="65" class="h">Workspace and Data Boundaries</text><text x="60" y="98" class="s">Each request is authenticated and scoped to a workspace before its records are read or changed.</text>
<rect x="65" y="150" width="300" height="145" rx="18" fill="#eaf4fc" stroke="#7caed0" stroke-width="2"/><text x="95" y="190" class="b">1 · Signed-in user</text><text x="95" y="224" class="t">Bearer token identifies</text><text x="95" y="250" class="t">the caller</text><text x="95" y="277" class="sm">Authentication dependency</text>
<rect x="445" y="150" width="320" height="145" rx="18" fill="#eef3ff" stroke="#94a8d7" stroke-width="2"/><text x="475" y="190" class="b">2 · Workspace membership</text><text x="475" y="224" class="t">User must belong to the</text><text x="475" y="250" class="t">requested workspace</text><text x="475" y="277" class="sm">Membership and role checks</text>
<rect x="850" y="150" width="570" height="145" rx="18" fill="#f3eef9" stroke="#b09acb" stroke-width="2"/><text x="880" y="190" class="b">3 · Workspace-scoped operation</text><text x="880" y="224" class="t">Router passes user + workspace context to service</text><text x="880" y="253" class="t">Service enforces feature-specific permissions</text><text x="880" y="278" class="sm">Unauthorized access is rejected before the change</text>
<path d="M365 222H440" class="line"/><path d="M765 222H845" class="line"/>
<rect x="65" y="375" width="1370" height="445" rx="24" fill="#fff" stroke="#aebdca" stroke-width="2"/><text x="100" y="420" class="b">Relational records carry workspace ownership</text><text x="100" y="450" class="s">Representative records in the source use workspace_id references to the workspaces table.</text>
<rect x="110" y="500" width="290" height="116" rx="15" fill="#edf7ef" stroke="#83b393" stroke-width="2"/><text x="140" y="540" class="b">Workspace A</text><text x="140" y="574" class="t">members · roles</text><text x="140" y="598" class="sm">workspace_id = A</text>
<rect x="110" y="660" width="290" height="116" rx="15" fill="#edf7ef" stroke="#83b393" stroke-width="2"/><text x="140" y="700" class="b">Workspace B</text><text x="140" y="734" class="t">members · roles</text><text x="140" y="758" class="sm">workspace_id = B</text>
<rect x="550" y="490" width="370" height="132" rx="15" fill="#f7f9fb" stroke="#b7c3cd" stroke-width="2"/><text x="580" y="530" class="b">Workspace A records</text><text x="580" y="564" class="t">documents · channels/messages</text><text x="580" y="592" class="t">tasks · calendar · meetings · files</text>
<rect x="550" y="650" width="370" height="132" rx="15" fill="#f7f9fb" stroke="#b7c3cd" stroke-width="2"/><text x="580" y="690" class="b">Workspace B records</text><text x="580" y="724" class="t">documents · channels/messages</text><text x="580" y="752" class="t">tasks · calendar · meetings · files</text>
<path d="M400 555H545" class="line"/><path d="M400 718H545" class="line"/>
<rect x="1020" y="520" width="355" height="220" rx="15" fill="#fff5e8" stroke="#d9b875" stroke-width="2"/><text x="1050" y="560" class="b">Private interaction data</text><text x="1050" y="598" class="t">Direct messages and private</text><text x="1050" y="625" class="t">channel content remain access-</text><text x="1050" y="652" class="t">controlled; excluded from shared</text><text x="1050" y="679" class="t">workspace memory indexing.</text><text x="1050" y="712" class="sm">Private content is not public memory.</text>
<path d="M920 555H1015" class="dash"/><path d="M920 718H1015" class="dash"/>
<rect x="65" y="850" width="1370" height="52" rx="12" fill="#e9eef3"/><text x="92" y="883" class="sm">Illustrates logical access boundaries in the application data model; it does not imply separate database servers per workspace.</text></svg>
